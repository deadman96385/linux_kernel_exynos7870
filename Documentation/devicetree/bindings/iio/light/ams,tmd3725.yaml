%YAML 1.2
---
$id: http://devicetree.org/schemas/iio/light/ams,tmd3725.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: ams TMD3725 ambient light, color, and proximity sensor

maintainers:
  - Linux IIO maintainers <linux-iio@vger.kernel.org>

description: |
  The TMD3725 combines clear, red, green, and blue ambient-light channels
  with an IR proximity sensor and integrated IR emitter.

  Datasheet:
    https://look.ams-osram.com/m/6a4d0816b7d3a4bf/original/TMD3725-ALS-Color-and-Proximity-Sensor-Module.pdf

allOf:
  - $ref: ../common.yaml#

properties:
  $nodename:
    pattern: '^light-sensor@[0-9a-f]+$'

  compatible:
    const: ams,tmd3725

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  vdd-supply:
    description: Regulator providing the sensor core supply.

  vled-supply:
    description: Regulator providing power to the integrated IR emitter.

  proximity-near-level: true

  ams,lux-coefficients:
    $ref: /schemas/types.yaml#/definitions/uint32-array
    minItems: 4
    maxItems: 4
    description: |
      Signed 32-bit red, green, blue, and clear coefficients, in that order,
      used to compensate for the optical window. Each value has a scale of
      1000 and negative values use two's-complement encoding.

  ams,device-factor:
    $ref: /schemas/types.yaml#/definitions/uint32
    description: Device and glass attenuation factor used for lux conversion.
    minimum: 1
    default: 831

  ams,cct-coefficient:
    $ref: /schemas/types.yaml#/definitions/uint32
    description: Blue-to-red ratio coefficient used for color temperature.
    default: 4091

  ams,cct-offset:
    $ref: /schemas/types.yaml#/definitions/uint32
    description: Offset in kelvin added to the calculated color temperature.
    default: 227

  wakeup-source: true

required:
  - compatible
  - reg

additionalProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/irq.h>

    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        light-sensor@39 {
            compatible = "ams,tmd3725";
            reg = <0x39>;
            interrupt-parent = <&gpio0>;
            interrupts = <5 IRQ_TYPE_EDGE_FALLING>;
            vled-supply = <&vled_reg>;
            proximity-near-level = <55>;
            ams,lux-coefficients = <0xfffffcc2 1100 0xfffffb64 1000>;
            ams,device-factor = <925>;
            ams,cct-coefficient = <3521>;
            ams,cct-offset = <2095>;
        };
    };
...
