%YAML 1.2
---
$id: http://devicetree.org/schemas/sound/samsung,s1402x.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Samsung S1402X on-chip audio mixer

maintainers:
  - Sean Hoyt <seanhoyt963@gmail.com>

description: |
  The S1402X mixes and routes the serial audio paths in the Exynos7870
  display-audio block.  It exposes seven DAIs for the application processor,
  modem, Bluetooth, FM, and amplifier paths.  DAI indices are defined in
  dt-bindings/sound/samsung,s1402x.h.

properties:
  compatible:
    const: samsung,s1402x

  reg:
    maxItems: 1

  clocks:
    items:
      - description: Application-processor serial-audio bit-clock gate
      - description: Bluetooth serial-audio bit-clock gate
      - description: Modem serial-audio bit-clock gate
      - description: FM serial-audio bit-clock gate
      - description: Mixer functional system clock
      - description: Rate-programmable mixer source clock
      - description: DISPAUD APB register-interface clock
      - description: Shared DISPAUD audio-subsystem APB clock

  clock-names:
    items:
      - const: ap-bclk
      - const: bt-bclk
      - const: cp-bclk
      - const: fm-bclk
      - const: mixer
      - const: dout
      - const: apb
      - const: audio-apb

  resets:
    maxItems: 1

  reset-names:
    const: mixer

  power-domains:
    maxItems: 1

  samsung,pmu-syscon:
    $ref: /schemas/types.yaml#/definitions/phandle
    description:
      PMU syscon containing the Bluetooth/FM input-path selector and the
      Exynos7870 DISPAUD power controls used when no generic power domain is
      attached.

  samsung,bt-fm-combo:
    type: boolean
    description:
      Bluetooth and FM share one serial input, so FM uses the Bluetooth mux
      selection and pin state.

  samsung,bck4-mcko:
    type: boolean
    description:
      Route the mixer master clock rather than the normal bit clock to BCK4.

  '#sound-dai-cells':
    const: 1

required:
  - compatible
  - reg
  - clocks
  - clock-names
  - resets
  - reset-names
  - power-domains
  - samsung,pmu-syscon
  - '#sound-dai-cells'

allOf:
  - $ref: dai-common.yaml#

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/clock/samsung,exynos7870-cmu.h>
    #include <dt-bindings/reset/samsung,exynos7870-dispaud.h>

    audio-mixer@14880000 {
        compatible = "samsung,s1402x";
        reg = <0x14880000 0x200>;
        clocks = <&cmu_dispaud CLK_GOUT_DISPAUD_CON_EXT2AUD_BCK_GPIO_I2S>,
                 <&cmu_dispaud CLK_GOUT_DISPAUD_CON_AUD_I2S_BCLK_BT_IN>,
                 <&cmu_dispaud CLK_GOUT_DISPAUD_CON_CP2AUD_BCK>,
                 <&cmu_dispaud CLK_GOUT_DISPAUD_CON_AUD_I2S_BCLK_FM_IN>,
                 <&cmu_dispaud CLK_GOUT_DISPAUD_MIXER_AUD_SYSCLK>,
                 <&cmu_dispaud CLK_DOUT_DISPAUD_MIXER>,
                 <&cmu_dispaud CLK_GOUT_DISPAUD_APB>,
                 <&cmu_dispaud CLK_GOUT_DISPAUD_APB_AUD>;
        clock-names = "ap-bclk", "bt-bclk", "cp-bclk", "fm-bclk", "mixer",
                      "dout", "apb", "audio-apb";
        resets = <&dispaud_reset EXYNOS7870_DISPAUD_RESET_MIXER>;
        reset-names = "mixer";
        power-domains = <&pd_dispaud>;
        samsung,pmu-syscon = <&pmu_system_controller>;
        #sound-dai-cells = <1>;
    };
