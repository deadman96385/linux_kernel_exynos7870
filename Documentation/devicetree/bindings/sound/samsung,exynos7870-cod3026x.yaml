%YAML 1.2
---
$id: http://devicetree.org/schemas/sound/samsung,exynos7870-cod3026x.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Samsung Exynos7870 audio complex with COD3026X codec

maintainers:
  - Sean Hoyt <seanhoyt963@gmail.com>

description: |
  The Exynos7870 application-processor I2S interface feeds the on-chip S1402X
  audio mixer. The mixer routes and converts the stream before driving the
  COD3026X analog codec. The card also describes the board-level microphone,
  earpiece, speaker, and headset connections.

allOf:
  - $ref: sound-card-common.yaml#

properties:
  compatible:
    const: samsung,exynos7870-cod3026x

  cpu:
    type: object
    additionalProperties: false
    properties:
      sound-dai:
        maxItems: 1
        description: Exynos7870 application-processor I2S DAI.
    required:
      - sound-dai

  mixer:
    type: object
    additionalProperties: false
    properties:
      sound-dai:
        maxItems: 1
        description: S1402X application-processor DAI.
    required:
      - sound-dai

  codec:
    type: object
    additionalProperties: false
    properties:
      sound-dai:
        maxItems: 1
        description: COD3026X primary audio DAI.
    required:
      - sound-dai

required:
  - compatible
  - model
  - audio-routing
  - cpu
  - mixer
  - codec

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/sound/samsung,s1402x.h>

    sound {
        compatible = "samsung,exynos7870-cod3026x";
        model = "Samsung Galaxy J7 Pro";

        audio-routing =
            "Headphone", "HPOUTLN",
            "Earpiece", "EPOUTN",
            "Speaker", "SPKOUTLN",
            "IN1L", "Main Mic",
            "Main Mic", "MICBIAS1",
            "IN2L", "Sub Mic",
            "Sub Mic", "MICBIAS1",
            "IN3L", "Headset Mic",
            "Headset Mic", "MICBIAS2";

        cpu {
            sound-dai = <&i2s0 0>;
        };

        mixer {
            sound-dai = <&s1402x S1402X_DAI_AP0>;
        };

        codec {
            sound-dai = <&cod3026x 0>;
        };
    };
