%YAML 1.2
---
$id: http://devicetree.org/schemas/mailbox/samsung,exynos7870-mbox.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Samsung Exynos7870 Mailbox Controller

maintainers:
  - Tudor Ambarus <tudor.ambarus@linaro.org>

description:
  The Exynos7870 mailbox has 16 bidirectional doorbell channels and 64 shared
  32-bit registers. A channel number selects the matching outgoing doorbell
  and incoming interrupt bit. Clients may access the shared registers through
  the syscon interface before ringing a doorbell.

properties:
  compatible:
    items:
      - const: samsung,exynos7870-mbox
      - const: syscon

  reg:
    maxItems: 1

  interrupts:
    description: Combined interrupt for the 16 incoming doorbells.
    maxItems: 1

  '#mbox-cells':
    const: 1
    description: Doorbell channel number from 0 through 15.

required:
  - compatible
  - reg
  - interrupts
  - '#mbox-cells'

additionalProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/arm-gic.h>

    mailbox@10570000 {
        compatible = "samsung,exynos7870-mbox", "syscon";
        reg = <0x10570000 0x180>;
        interrupts = <GIC_SPI 373 IRQ_TYPE_NONE>;
        #mbox-cells = <1>;
    };
